# Publication config for *Python by Projects* (design 010 D1, plan 098).
# Read and validated by tools/books.py (publication_config). Paths and chapter globs are book-relative.

# The setup chapter: numbered "Unit 0 — Getting Set Up"; its teacher notes print only in the Teacher's Edition.
setup:
  source: docs/unit-00-getting-set-up.md
  teacher_notes: docs/unit-00-teacher-notes.md
  numbered: true

# Each project's running header (the audit's header-reset rule is derived from these).
project_headers:
  project-01-arcade-night: Arcade Night
  project-02-grand-adventure: Grand Adventure

lesson_heading: '^## Lesson\b'

# The Python names the index recognises (a "Python names" subentry each), all taught in this book.
index_names: [print, input, range, len, str, int, float, append, open, sorted, randint]

audit:
  # Lesson cells tagged error-demo / hang-demo (re-derived by the audit from the sources).
  error_demo_ids: ['8a9940ed', cff23dfd, b9137a93, '09e1db93', c172f647, d1c787cd]
  hang_demo_ids: []
  error_demo_routing_exceptions: []
  print_required_starters: []
  print_page_target: 400
  turtle_tryits:
    unit-03-turtle-art-studio: 0
    unit-05-function-factory: 0
  teacher_turtle_drawings: 0
  phrase_exemptions: []
  goals_recap: required
