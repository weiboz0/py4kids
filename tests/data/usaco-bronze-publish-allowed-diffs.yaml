# Plan 100 regression contract for *Contest Python: USACO Bronze* (design 010; plan 100 Phase A step 0).
# tests/data/usaco-bronze-publish-baseline.json is the immutable digest of every generated .qmd and
# inventory.json of usaco-bronze's four editions, captured before any plan-100 code change (commit
# 9e474a4). The regression test (tests/test_publication_regression.py) allows a generated file to
# differ from it only when it is listed here as {edition, file, reason}, with a reason naming the
# design 010 D2/D3 rule that requires the change. A listed file that no longer differs fails the test.
# Digests are taken after the test's `normalised` step, as for python-concepts.
#
# Plan 100 Phase A2 (chapter kicker reset, a D2 rendering fix) changes each back-matter chapter's
# generated source, and nothing else: the answers appendix, Glossary and Quick Reference headings gain
# an empty `{pub-label=""}`, and the-index.qmd gains `\pubchapterlabel{}` before `\printindex`, so no
# back-matter chapter opens under the last main-matter chapter's kicker (ACSL's "Checkpoint 4").
# Verified: reverting exactly those lines reproduces every baseline digest.
allowed_diffs:
- edition: student-print
  file: glossary.qmd
  reason: D2 back-matter kicker reset (plan 100 A2) — the "Glossary" heading gains an empty pub-label; nothing else changes.
- edition: student-print
  file: quick-reference.qmd
  reason: D2 back-matter kicker reset (plan 100 A2) — the "Quick Reference" heading gains an empty pub-label; nothing else changes.
- edition: student-print
  file: the-index.qmd
  reason: D2 back-matter kicker reset (plan 100 A2) — \pubchapterlabel{} is emitted before \printindex; nothing else changes.
- edition: student
  file: answers.qmd
