# Plan 097 regression contract (design 010 D1; plan 097 Phase A step 3).
# tests/data/python-concepts-publish-baseline.json is the immutable pre-change digest of every generated
# .qmd and inventory.json of python-concepts' four editions. The regression test
# (tests/test_publication_regression.py) allows a generated file to differ from it only when it is
# listed here as {edition, file, reason}, with a reason naming the design 010 D2/D3 rule that requires
# the change. A listed file that no longer differs fails the test, so the list stays minimal.
# Digests are taken after the test's `normalised` step (datafile panels and `data:*` inventory
# records removed: project data files are generated by executing solutions and are not in the
# repository), so the contract holds with or without those files present.
#
# Plan 097's D2 rules change no python-concepts output: its items keep heading-only `## Exercise N`
# statement cells, it has no structural subsections, division lines, placeholders, verify cells or
# stdin lesson programs, and its answer markdown is unchanged by markdown_blocks (answers keep their
# code fences whole).
# The D3 heading-cell rule (content review r1: a solution heading cell's body is part of the worked
# answer) changes four answers. 25 python-concepts solution heading cells have a body: 20 only label
# and list (or point to) a solution asset that the answer prints as a program panel anyway, and one
# (checkpoint-02 Question 7) restates its statement verbatim; both kinds stay unprinted. The other
# four hold explanations the old answer key dropped, and now print: unit-06 Exercise 17 and unit-07
# Exercises 7, 27 and 28. Odd exercises also print in the Student Book answers and the Answer Key.
allowed_diffs:
- edition: teacher
  file: unit-06-turtle-geometry.qmd
  reason: D3 heading-cell answer text — Exercise 17 (The Eight-Degree Gap) prints its explanation of the 360 // 11 gap.
- edition: teacher
  file: unit-07-functions.qmd
  reason: D3 heading-cell answer text — Exercises 7, 27 and 28 print their note on what the asset draws.
- edition: student
  file: answers.qmd
  reason: D3 heading-cell answer text — odd answers unit-06 Exercise 17 and unit-07 Exercises 7 and 27.
- edition: answer-key
  file: answers-unit-06-turtle-geometry.qmd
  reason: D3 heading-cell answer text — Exercise 17 (The Eight-Degree Gap) prints its explanation.
- edition: answer-key
  file: answers-unit-07-functions.qmd
  reason: D3 heading-cell answer text — Exercises 7 and 27 print their note on what the asset draws.
