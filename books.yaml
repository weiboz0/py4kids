books_version: 2
# Book registry (design 008). Each id is also the book's folder (root) and the
# stem of its PDF file names (output/<id>/<id>-<edition>.pdf).
# Student-facing pages name a book by its title, never by its id.
# `number` is a series ordinal only; it drives no tooling.
#
# Feature flags (booleans; absent means false). Tools key on these flags,
# never on book ids:
#   publication: the book-publication pipeline (publish, publish-audit, the
#                edition PDFs and the per-book cover/front matter).
#   judge:       stdin `.py` solvers and the subprocess judge (the contest
#                source policy and the solution-notebook judge harness).
#   patterns:    the pattern checks (patterns.yaml, patterns doc) AND the
#                coverage-map v2 / markdown concept scan. Do not set it on a
#                new book unless both apply.
books:
- id: python-projects
  number: 1
  root: python-projects
  title: Python by Projects
  subtitle: Learn Python by building things
  depends_on: []
  lesson_budget: [28, 44]
  patterns: true
- id: python-concepts
  number: 1
  root: python-concepts
  title: Python, Concept by Concept
  subtitle: Learn Python one idea at a time
  depends_on: []
  variant_of: python-projects
  prereq_policy: fastforward
  concept_minimum: 40
  lesson_budget: [30, 60]
  publication: true
- id: usaco-bronze
  number: 2
  root: usaco-bronze
  title: 'Contest Python: USACO Bronze'
  subtitle: Algorithms for your first programming contests
  depends_on:
  - python-projects
  judge: true
