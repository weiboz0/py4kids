[project]
name = "racekit"
version = "0.1.0"
description = "The race harness for Applied Python: Autonomous Racing (a harness, never a submission dependency)"
# racekit itself is Python 3.8-compatible (design 013 §4): the official race environment is
# Python 3.8 with numpy < 1.25, and a routed test runs check_submission there in isolation.
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Imported lazily, only by the analysis modules that need them; the core is numpy-only.
analysis = [
    "scipy",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["racekit"]
