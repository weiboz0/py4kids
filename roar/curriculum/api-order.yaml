api_order_version: 1
# The API-ordering map (design 013 §7.1), checked by roar/tests/test_roar_guards.py.
#   infrastructure: callables in baseline.yaml `library_methods` that need no teaching (the shim
#                   API, racekit harness calls, assumed numpy and standard-library names).
#   taught:         `name` or `module:name` -> the concept id that teaches it. A taught callable
#                   may not appear in any entry (or entry-positioned file) before the coverage-map
#                   entry that introduces its concept.
# Every `library_methods` name must be in exactly one of the two; every `taught` key must be in
# `library_methods`. roar-002 added the first names with Unit 1; roar-003 added Units 2–3's; roar-008 added Units 8–9's; roar-009 added Unit 10's.
infrastructure: [KinematicCar, Path, TemporaryDirectory, abs, advance, allclose, apply_action, arange, argmax, argmin, array, atan, atan2, check_submission, clip, column_stack, concatenate, cos, degrees, diff, empty, enumerate, float, floor, get, get_last_gym_observation, getsource, hypot, initialize, int, isfinite, isinstance, isnan, items, join, len, linspace, list, load_submission, load_track, log2, max, mean, median, min, mkdtemp, nonzero, norm, percentile, print, race_meta, radians, range, read, readline, reset, roll, round, run_race, seed, shim_installed, sign, sin, sorted, spread, sqrt, std, step, str, sum, tan, vstack, where, write, write_variant, zeros, zip]
