[project]
name = "py4kids-tools"
version = "0.1.0"
description = "Verification and build tooling for the py4kids course"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat",
    "pyyaml",
]

[project.scripts]
py4kids-tools = "tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# The `recsys` book's heavy numerical/ML stack (design 011 §7). Selected/installed only
# when `ci-local.sh` routes that book through `uv run --group recsys`; the other books'
# commands never require or import these. torch is pinned to the CPU wheel (below) to avoid
# the multi-GB `nvidia-*` CUDA tree. `bookrec` is the editable local project package (Phase F).
# `psycopg`/`gensim` are deliberately NOT here: they are slice/derivation-only, imported lazily
# (fail-closed) by `recsys/data/slice_books.py` and never on the CI exec path. Linux-CPU-only.
recsys = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "torch",
    "faiss-cpu",
    "bookrec",
]
# The `roar` book's stack (design 013 §3/§7.1). Selected only when `ci-local.sh` routes that book
# through `uv run --group roar`. `racekit` is the editable local harness package; it is itself
# Python 3.8-compatible (the official race runs Python 3.8), and a routed test runs its
# check_submission in an isolated `uv run --no-project --python 3.8` environment.
roar = [
    "numpy",
    "scipy",
    "matplotlib",
    "racekit",
]

# CPU-only torch: the explicit index is used ONLY for packages routed to it via
# [tool.uv.sources] (explicit=true), so it never shadows the default index for anything else.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
bookrec = { path = "recsys/projects/bookrec", editable = true }
racekit = { path = "roar/projects/racekit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real LaTeX/Quarto renders (plan 097); ci-local runs them"]
