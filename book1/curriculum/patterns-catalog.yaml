sentinel-loop:
  hook: "You know when you're done; the program must ask \"done yet?\" every pass."
  enabling_concepts: [while-loop, comparison]
running-total:
  hook: "Keep a named box for the total-so-far, and update it each step."
  enabling_concepts: [accumulator, arithmetic]
count-by-condition:
  hook: "Keep a counter; check each item once, bump it when it matches. The tally-by-key variation keeps one counter per group."
  enabling_concepts: [if-statement, comparison]
transform-each:
  hook: "Give every item the same change, and collect the results in a new sequence."
  enabling_concepts: [for-loop, string-methods]
linear-search:
  hook: "Check items one by one; break when found so the program stops working early."
  enabling_concepts: [for-loop, break-statement, in-operator]
find-extreme:
  hook: "Keep the best so far while scanning, and remember who, not just the number."
  enabling_concepts: [list-loop, comparison]
