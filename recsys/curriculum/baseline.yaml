baseline_version: 1
# Assumed-baseline concepts for this advanced book (design 011 §2/§4): concepts a student is
# assumed to already know, so they are legal to USE without being introduced, earn no teaching or
# practice credit, and are never assessed. This is the precise, user-authorised carve-out from
# design 000's middle-school baseline — NOT a wholesale waiver: every other law (project-first,
# coverage, taught-before-assessed for what the book DOES teach, hygiene, stretch, teacher-notes,
# checkpoints) is retained. None of these ids may also appear in this book's concepts.yaml.
# Prereq-closure, coverage, and the concept scan treat these as known-but-uncredited.
