# and `Adam` are already listed (Unit 8/9). `log1p` is the log-popularity feature; `Sequential` /
# `ReLU` / `relu` / `BCEWithLogitsLoss` / `sigmoid` are the pointwise-logistic MLP idioms.
# `assemble_training_matrix` / `set_model` are the reranker's assemble-once-then-swap-variants API
