# External artifacts for the aio books (design 014 D8), provisioned into the git-ignored
# reference/cache/ by scripts/aio/aio-provision-cache.sh, which verifies each sha256.
# aio-dl downloads nothing; every artifact here is consumed by aio-ml.
# Notebooks set GENSIM_DATA_DIR / TORCH_HOME to <book>/reference/cache/{gensim,torch} themselves.
schema: 1
artifacts:
  # gensim.downloader.load("glove-wiki-gigaword-100") needs three files in GENSIM_DATA_DIR:
  # the index (information.json, refreshed from list.json when online), the model's loader
  # module (__init__.py) and the data file. The index is pinned to a gensim-data commit so its
  # bytes cannot drift under the recorded sha256.
  - id: gensim-information-json
    url: https://raw.githubusercontent.com/RaRe-Technologies/gensim-data/bd93f51f7536dbf84f194cd8a81c0644b7b95b41/list.json
