    size: 21626
    consumers: [gensim.downloader index for glove-wiki-gigaword-100]
  - id: glove-wiki-gigaword-100-loader
    url: https://github.com/RaRe-Technologies/gensim-data/releases/download/glove-wiki-gigaword-100/__init__.py
